name: Windows · distribution Firefox portable

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "README.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Archive Windows portable (Firefox)
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire la distribution Firefox portable
        shell: pwsh
        run: pwsh -File windows/build.ps1

      - name: Publier l'archive portable
        uses: actions/upload-artifact@v4
        with:
          name: plimb-browser-windows-portable
          path: windows/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release automatique
    runs-on: ubuntu-latest
    needs: portable
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Renommer l'archive
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/Plimb-Browser-Windows-Portable.zip \;
          ls -la release

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plimb Browser · build ${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release/*.zip
