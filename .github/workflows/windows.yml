name: Windows · application portable

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "README.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Exécutable Windows portable
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Compiler la version portable
        working-directory: windows
        run: npx electron-builder --win portable --publish never

      - name: Publier l'exécutable portable
        uses: actions/upload-artifact@v4
        with:
          name: plimb-browser-windows-portable
          path: windows/dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Lister les fichiers produits
        working-directory: windows
        run: Get-ChildItem -Recurse dist-electron | Select-Object FullName

  release:
    name: Release automatique
    runs-on: ubuntu-latest
    needs: portable
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          find artifacts -name "*.exe" -exec cp {} release/ \;
          ls -la release

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plimb Browser · build ${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release/*.exe
